  <defs>
    <linearGradient id="heat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4642b"/>
      <stop offset="1" stop-color="#c9200f"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="26" fill="url(#heat)"/>
  <path d="M88 28c6 26-4 50-26 61-15 7-33 3-33-11 0-10 8-15 17-12 16 5 29-8 32-28"
        fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round"/>
</svg>
