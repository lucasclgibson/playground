<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jacks Spicy Test Booker</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header class="bar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 128 128" focusable="false">
            <defs>
              <linearGradient id="heat" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#f4642b" />
                <stop offset="1" stop-color="#c9200f" />
              </linearGradient>
            </defs>
            <rect width="128" height="128" rx="26" fill="url(#heat)" />
            <path
              d="M88 28c6 26-4 50-26 61-15 7-33 3-33-11 0-10 8-15 17-12 16 5 29-8 32-28"
              fill="none"
              stroke="#fff"
              stroke-width="24"
              stroke-linecap="round"
            />
          </svg>
        </span>
        <h1>Jacks Spicy Test Booker</h1>
      </div>
      <button id="settings" class="icon-button" type="button" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path
            d="M12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Zm7.4-2.6.1-.9-.1-.9 1.9-1.5-1.9-3.2-2.3.8a7 7 0 0 0-1.6-.9L15.1 4h-3.7l-.4 2.3a7 7 0 0 0-1.6.9l-2.3-.8-1.9 3.2 1.9 1.5-.1.9.1.9-1.9 1.5 1.9 3.2 2.3-.8c.5.4 1 .7 1.6.9l.4 2.3h3.7l.4-2.3c.6-.2 1.1-.5 1.6-.9l2.3.8 1.9-3.2-1.9-1.5Z"
          />
        </svg>
      </button>
    </header>

    <main id="main">
      <section class="empty" id="empty" hidden>
        <h2>Nothing saved yet</h2>
        <p>Add the licence, theory and card details once. They stay on this computer.</p>
        <button class="primary" id="empty-settings" type="button">Add details</button>
      </section>

      <section class="group" id="group-identity" hidden>
        <h2>Booking details</h2>
        <div class="rows" id="rows-identity"></div>
      </section>

      <section class="group" id="group-card" hidden>
        <h2>Payment card</h2>
        <div class="rows" id="rows-card"></div>
      </section>
    </main>

    <footer class="foot">
      <button class="secondary" id="clear-clipboard" type="button">Clear clipboard</button>
      <p class="note">
        Stored on this computer only. Nothing is sent anywhere, and the details never touch the DVSA page
        itself.
      </p>
    </footer>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
